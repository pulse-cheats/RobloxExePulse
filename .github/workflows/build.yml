name: Build Roblox Executor dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Install Dependencies
      run: |
        brew install llvm

    - name: Download ImGui Headers
      run: |
        # Download ImGui source directly into include/
        curl -L "https://github.com/ocornut/imgui/archive/refs/tags/v1.91.0.tar.gz" -o imgui.tar.gz
        tar -xzf imgui.tar.gz
        cp -r imgui-1.91.0/*.h imgui-1.91.0/*.cpp imgui/
        # Copy backends
        cp imgui-1.91.0/backends/imgui_impl_metal.h imgui/
        cp imgui-1.91.0/backends/imgui_impl_metal.mm imgui/
        cp imgui-1.91.0/backends/imgui_impl_uikit.h imgui/
        cp imgui-1.91.0/backends/imgui_impl_uikit.mm imgui/
        rm -rf imgui-1.91.0 imgui.tar.gz

    - name: Download Luau Headers
      run: |
        # Clone Luau repo for headers
        git clone --depth 1 https://github.com/Roblox/luau.git
        cp -r luau/Lua/ include/luau/
        cp -r luau/Luau/ include/luau/
        rm -rf luau

    - name: Build dylib
      run: |
        mkdir -p build
        
        # 1. Compile ImGui Metal Backend (needs to be compiled with Apple Clang usually, but let's try standard clang++)
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          include/imgui/imgui_impl_metal.mm \
          -o build/imgui_impl_metal.o

        # 2. Compile Luau Bridge
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/luau \
          -I./src \
          src/luau_bridge.cpp \
          -o build/luau_bridge.o

        # 3. Compile UI (UIKit/Metal Bridge)
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -I./include/luau \
          -I./src \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          src/ui.mm \
          -o build/ui.o

        # 4. Compile Main
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -I./include/luau \
          -I./src \
          src/main.cpp \
          -o build/main.o

        # 5. Link everything into dylib
        clang++ -shared \
          build/imgui_impl_metal.o \
          build/luau_bridge.o \
          build/ui.o \
          build/main.o \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          -o RobloxExecutor.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RobloxExecutor-dylib
        path: RobloxExecutor.dylib
