name: Build Roblox Executor dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Install Dependencies
      run: brew install llvm

    - name: Setup ImGui Headers
      run: |
        mkdir -p include/imgui
        git clone --depth 1 https://github.com/ImGuIu/imgui.git imgui_repo
        cp imgui_repo/imgui.h imgui/imgui.h
        cp imgui_repo/imgui.cpp imgui/imgui.cpp
        cp imgui_repo/imgui_draw.cpp imgui/imgui_draw.cpp
        cp imgui_repo/imgui_widgets.cpp imgui/imgui_widgets.cpp
        cp imgui_repo/imgui_tables.cpp imgui/imgui_tables.cpp
        cp imgui_repo/imconfig.h imgui/imconfig.h
        cp imgui_repo/imgui_internal.h imgui/imgui_internal.h
        cp imgui_repo/imstb_*.h imgui/
        cp imgui_repo/backends/imgui_impl_metal.h imgui/
        cp imgui_repo/backends/imgui_impl_metal.mm imgui/
        cp imgui_repo/backends/imgui_impl_uikit.h imgui/
        cp imgui_repo/backends/imgui_impl_uikit.mm imgui/
        rm -rf imgui_repo

    - name: Setup Luau Headers
      run: |
        mkdir -p include/luau
        git clone --depth 1 https://github.com/Roblox/luau.git luau_repo
        cp -r luau_repo/Lua/*.h include/luau/
        cp -r luau_repo/Luau/*.h include/luau/
        cp -r luau_repo/Luau/*.cpp include/luau/
        cp luau_repo/Lua/lua.hpp include/luau/
        rm -rf luau_repo

    - name: Build dylib
      run: |
        mkdir -p build
        
        # 1. Compile ImGui Metal Backend
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          include/imgui/imgui_impl_metal.mm \
          -o build/imgui_impl_metal.o

        # 2. Compile Luau Bridge
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/luau \
          -I./src \
          src/luau_bridge.cpp \
          -o build/luau_bridge.o

        # 3. Compile UI (UIKit/Metal Bridge)
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -I./include/luau \
          -I./src \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          src/ui.mm \
          -o build/ui.o

        # 4. Compile Main
        clang++ -std=c++17 -fPIC -c \
          -I./include \
          -I./include/imgui \
          -I./include/luau \
          -I./src \
          src/main.cpp \
          -o build/main.o

        # 5. Link everything into dylib
        clang++ -shared \
          build/imgui_impl_metal.o \
          build/luau_bridge.o \
          build/ui.o \
          build/main.o \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          -o RobloxExecutor.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RobloxExecutor-dylib
        path: RobloxExecutor.dylib
